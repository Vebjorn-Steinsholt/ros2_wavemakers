/wavemakers/ladertanken/controller:
  ros__parameters:
    driver_address: "192.168.1.70"
    driver_port: 502
    driver_unit_id: 1

    input_base_reg: 0
    input_word_count: 7
    output_base_reg: 0
    output_word_count: 6
    input_uses_fc4: true

    status_base_reg: 768       # 0x0300
    status_word_count: 9

    poll_interval_ms: 20      # poll_rate_probe 2026-10-07: cycles 4-8 ms, rare ~210 ms stalls
    timeout_ms: 1000
    reconnect_ms: 2000
    write_only_dirty: false

    profibus_address: 2
    # 2026-10-20: raised for 0.171 m / 1.3 s with the gain table and hinge_height 0.09
    # (needs +/-248 deg, 200 rpm); +10 % travel, 1.2 x peak speed. No mechanical end stops.
    max_velocity_rpm: 240.0
    min_position_deg: -275.0
    max_position_deg: 275.0
    in_position_tol_deg: 0.1
    step_timeout_ms: 10000

    wavemaker_type: "flap"
    wavemaker_id: "ladertanken"
    wavemaker_upright_position_m: 0.0  # Upright oscillation center [m]
    wavemaker_upright_is_minimum: false
    wavemaker_mode_pregenerated: false
    water_depth: 1.0         
    flap_attachment_height: 1.30
    hinge_height: 0.09  # pivot above the floor, wall below closed (2026-10-20)
    actuator_drive_type: "angular"
    actuator_upright_angle_deg: 0.0
    actuator_lead_m_per_degree: 0.00053  # 5.3 cm flap change per 100 deg [m/deg]
    # Measured / target wave height (regular waves only); the stroke is divided by it.
    # 1.0 = linear theory. To correct: new gain = old gain * measured / target.
    wavemaker_transfer_gain: 1.0
    # Gain per period [s], interpolated linearly, nearest end value outside; replaces
    # wavemaker_transfer_gain when set (COMMISSIONING.md, Transfer gain calibration).
    # Provisional, from the 2026-10-19 wave-probe runs at gain 1.0 and 0.8 (taken with
    # hinge_height 0.0, converted to 0.09). 0.7 s (measured 0.55) is left out until it is
    # remeasured; below 0.8 s the 0.86 end value is used. Valid for water_depth 1.0 only.
    wavemaker_transfer_gain_periods: [0.8, 0.9, 1.0, 1.3, 1.5]
    wavemaker_transfer_gain_values:  [0.86, 0.73, 0.85, 0.76, 0.78]

/wavemakers/lilletanken/controller:
  ros__parameters:
    wavemaker_type: "piston"
    wavemaker_id: "lilletanken"
    wavemaker_minimum: 0.0
    wavemaker_maximum: 0.5
    wavemaker_mode_pregenerated: false
    water_depth: 1.0
    # flap_attachment_height omitted — fine, piston never checks it
    actuator_drive_type: "linear"
    min_position_m: 0.0
    max_position_m: 0.5
    wavemaker_transfer_gain: 1.0  # see ladertanken

/wavemakers/mclab/controller:
  ros__parameters:
    wavemaker_type: "flap"
    wavemaker_id: "mclab"
    wavemaker_minimum: 0.0
    wavemaker_maximum: 0.5
    wavemaker_upright_position_m: 0.0
    wavemaker_upright_is_minimum: false
    wavemaker_mode_pregenerated: false
    water_depth: 1.5
    flap_attachment_height: 1.95   # must be > water_depth (1.5)
    hinge_height: 0.5
    actuator_drive_type: "linear"
    min_position_m: 0.0
    max_position_m: 0.5
    wavemaker_transfer_gain: 1.0  # see ladertanken
