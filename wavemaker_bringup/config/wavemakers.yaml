/wavemakers/ladertanken/controller:
  ros__parameters:
    driver_address: "192.168.1.70"
    driver_port: 502
    driver_unit_id: 1

    input_base_reg: 0
    input_word_count: 7
    output_base_reg: 0
    output_word_count: 6
    input_uses_fc4: true

    status_base_reg: 768       # 0x0300
    status_word_count: 9

    poll_interval_ms: 20      # poll_rate_probe 2026-10-07: cycles 4-8 ms, rare ~210 ms stalls
    timeout_ms: 1000
    reconnect_ms: 2000
    write_only_dirty: false

    profibus_address: 2
    max_velocity_rpm: 170.0
    min_position_deg: -200.0
    max_position_deg: 200.0
    in_position_tol_deg: 0.1
    step_timeout_ms: 10000

    wavemaker_type: "flap"
    wavemaker_id: "ladertanken"
    wavemaker_upright_position_m: 0.0  # Upright oscillation center [m]
    wavemaker_upright_is_minimum: false
    wavemaker_mode_pregenerated: false
    water_depth: 1.01            
    flap_attachment_height: 1.30
    hinge_height: 0.0
    actuator_drive_type: "angular"
    actuator_upright_angle_deg: 0.0
    actuator_lead_m_per_degree: 0.00053  # 5.3 cm flap change per 100 deg [m/deg]
    # Measured / target wave height (regular waves only); the stroke is divided by it.
    # 1.0 = linear theory. To correct: new gain = old gain * measured / target.
    wavemaker_transfer_gain: 1.0

/wavemakers/lilletanken/controller:
  ros__parameters:
    wavemaker_type: "piston"
    wavemaker_id: "lilletanken"
    wavemaker_minimum: 0.0
    wavemaker_maximum: 0.5
    wavemaker_mode_pregenerated: false
    water_depth: 1.0
    # flap_attachment_height omitted — fine, piston never checks it
    actuator_drive_type: "linear"
    min_position_m: 0.0
    max_position_m: 0.5
    wavemaker_transfer_gain: 1.0  # see ladertanken

/wavemakers/mclab/controller:
  ros__parameters:
    wavemaker_type: "flap"
    wavemaker_id: "mclab"
    wavemaker_minimum: 0.0
    wavemaker_maximum: 0.5
    wavemaker_upright_position_m: 0.0
    wavemaker_upright_is_minimum: false
    wavemaker_mode_pregenerated: false
    water_depth: 1.5
    flap_attachment_height: 1.95   # must be > water_depth (1.5)
    hinge_height: 0.5
    actuator_drive_type: "linear"
    min_position_m: 0.0
    max_position_m: 0.5
    wavemaker_transfer_gain: 1.0  # see ladertanken
